# Curated models, in the order the settings window lists them; exactly one is
# the default. Fields come from the Hub: `revision` is a full commit, `sha256`
# and `size` the LFS object of `file` there, `license` the card's
# `license_name` (or its SPDX `license`). `language_hint` marks models that
# take `[model] language`.
#
# `role` and `[model.benchmark]` are Handy's, for the very same files: its
# catalog at github.com/cjpais/Handy 73cc8579cff74e97e08de9d86035a92e4335ff7f,
# src-tauri/src/catalog/catalog.json (@handy-computer/models 0.2.3), where the
# 110M is `parakeet-tdt_ctc-110m`. `english_error` is
# `results.<id>.accuracy.en.error` (% of words wrong, FLEURS test split);
# `gpu_speed` and `cpu_speed` are `results.<id>.performance.accelerated` and
# `.cpu` (times faster than real time for the Q8_0 file on a Ryzen 4750U with
# Vulkan, and on its CPU). No table: Handy hasn't measured it.

[[model]]
id = "parakeet-unified-en-0.6b"
name = "Parakeet Unified 0.6B"
summary = "The best all-round model for English."
repo = "handy-computer/parakeet-unified-en-0.6b-gguf"
file = "parakeet-unified-en-0.6b-Q8_0.gguf"
revision = "7e948f21b7bdbac698d3318db9d350f1096f3b6c"
sha256 = "4b50b6dd862bf6e346929aaf4f5eaacec003bfa3f56462d6c874b41ef2f38795"
size = 731357568
license = "nvidia-open-model-license"
languages = ["en"]
streaming = true
default = true
role = "recommended"

[model.benchmark]
english_error = 3.99
gpu_speed = 25.28
cpu_speed = 13.955

