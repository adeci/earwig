# Curated models shipped with this release, in the order the settings
# window lists them. Exactly one entry is the default. Anything else the
# engine can load is reachable through Hugging Face search or a local path.
#
# Every field comes from the Hub: `revision` is a full commit, `sha256` and
# `size` are the LFS object of `file` at that commit, `license` is the card's
# `license_name` (or `license` when it is an SPDX id). `language_hint = true`
# marks a model that takes a language hint (`[model] language`); only those
# get a Language row in the settings window.
#
# `role` is the tag Handy's picks give a model for English dictation
# (`recommended`, `faster` or `accurate`, from @handy-computer/models); the
# rest have none.
#
# `[model.benchmark]` is Handy's measurement of the very same file (the
# sha256 Handy benchmarked), copied from Handy's catalog: github.com/
# cjpais/Handy at commit 73cc8579cff74e97e08de9d86035a92e4335ff7f,
# src-tauri/src/catalog/catalog.json (the same file as catalog.json in
# @handy-computer/models 0.2.3). `english_error` is
# `results.<id>.accuracy.en.error`: the percentage of words wrong in English
# on FLEURS (test split). `gpu_speed` and `cpu_speed` are
# `results.<id>.performance.accelerated` and `.cpu`: how many times faster
# than real time the Q8_0 file transcribes on a Ryzen 4750U laptop with
# Vulkan, and on its processor alone. Handy's id for the 110M is
# `parakeet-tdt_ctc-110m`. The settings window grades them as that package
# does: `accuracyGrade` (Handy's A to F) and `speedMeterLevel` (five steps of
# the seconds 30 s of speech take). A model Handy hasn't measured gets no
# table, and no meters.

[[model]]
id = "parakeet-unified-en-0.6b"
name = "Parakeet Unified 0.6B"
summary = "The best all-round model for English."
repo = "handy-computer/parakeet-unified-en-0.6b-gguf"
file = "parakeet-unified-en-0.6b-Q8_0.gguf"
revision = "7e948f21b7bdbac698d3318db9d350f1096f3b6c"
sha256 = "4b50b6dd862bf6e346929aaf4f5eaacec003bfa3f56462d6c874b41ef2f38795"
size = 731357568
license = "nvidia-open-model-license"
languages = ["en"]
streaming = true
default = true
role = "recommended"

[model.benchmark]
english_error = 3.99
gpu_speed = 25.28
cpu_speed = 13.955

