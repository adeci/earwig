[package]
name = "earwig-transcribe"
description = "earwig speech engine backed by transcribe.cpp (GGUF; Vulkan, Metal or CPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
earwig-core.workspace = true
flume.workspace = true
log.workspace = true

[features]
# For a package whose one build serves every CPU (Nix's, on x86-64 Linux):
# transcribe.cpp as a shared library with each compute backend a module beside
# it, on x86-64 one CPU module per instruction-set generation, the best one
# picked at run time. Without it the engine is linked in, tuned to the CPU that
# builds it.
dynamic-backends = ["transcribe-cpp/dynamic-backends"]

# Every build also has the CPU backend.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { workspace = true, features = ["vulkan"] }

[lints]
workspace = true
