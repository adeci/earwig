[package]
name = "earwig-transcribe"
description = "earwig speech engine backed by transcribe.cpp (GGUF; Vulkan, Metal or CPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
earwig-core.workspace = true
flume.workspace = true
log.workspace = true

# Every build also has the CPU backend.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { workspace = true, features = ["vulkan"] }

[lints]
workspace = true
