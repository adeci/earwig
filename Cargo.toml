[workspace]
resolver = "3"
members = [
  "crates/earwig",
  "crates/earwig-core",
  "crates/earwig-transcribe",
  "crates/earwigw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/adeci/earwig"
rust-version = "1.92"

[workspace.dependencies]
earwig-core = { path = "crates/earwig-core" }
earwig-transcribe = { path = "crates/earwig-transcribe" }

anyhow = "1"
# remote_desktop needs screencast to compile (ashpd 0.13.13).
ashpd = { version = "0.13", default-features = false, features = [
  "async-io",
  "global_shortcuts",
  "remote_desktop",
  "screencast",
  "clipboard",
  "settings",
] }
async-io = "2"
atspi-proxies = "0.13"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
ctrlc = "3"
dirs = "7"
# Windows resources (the app icon) for the binaries.
embed-resource = "3"
env_logger = "0.11"
flume = "0.12"
futures-lite = "2"
hex = "0.4"
hound = "3"
log = "0.4"
# Lists the sound server's microphones and records from one (Linux): the
# PulseAudio protocol, which PipeWire speaks too, in pure Rust.
pulseaudio = "0.3"
raw-window-handle = "0.6"
reis = { version = "0.7", features = ["async-io"] }
rubato = "5"
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = { version = "3", features = ["json"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Moving the overlay popup on X11, which GPUI cannot do after it opened.
x11rb = "0.13"
xkbcommon = "0.9"

# GPUI comes from the `gpui-pre` snapshot that gpui-component is pinned to;
# bump them together.
gpui-kit = "=0.9.0"
ksni = { version = "0.3", default-features = false, features = [
  "async-io",
  "blocking",
] }
# Draws the tray icon from its SVG; the version GPUI renders SVGs with.
resvg = { version = "0.46", default-features = false }
# The tray on Windows (and macOS): the notification area, `NSStatusItem`.
tray-icon = { version = "0.26", default-features = false }
# Reads the bundled font in tests; the version GPUI parses fonts with.
ttf-parser = "0.25"

# Vendored C++ build; the GPU backend is compiled in statically (no
# runtime-loaded backend modules to stage next to the binary). Each target
# picks its backend in earwig-transcribe: Metal on macOS, Vulkan elsewhere.
transcribe-cpp = { version = "0.4.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 16
