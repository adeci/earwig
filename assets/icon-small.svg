<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The app icon at 16-24 px, where earwig.ico takes those sizes from (32 px
       and up come from io.github.adeci.earwig.svg): the tray's fattened pill
       in the app icon's colours, filling the square, without the ripple that
       would only blur there. -->
  <defs>
    <linearGradient id="pill" x1="0" y1="26" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c3048"/>
      <stop offset="0.5" stop-color="#1f2130"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="26" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <g transform="translate(128 128) scale(0.92) translate(-128 -128)">
    <path fill="url(#pill)" stroke="url(#rim)" stroke-width="22"
          d="M66 44 C82 44 82 26 98 26 C116 26 116 50 134 50 C149 50 149 34 164 34 C177 34 177 44 190 44
             A60 60 0 0 1 250 104 L250 152 A60 60 0 0 1 190 212
             C174 212 174 230 158 230 C140 230 140 206 122 206 C107 206 107 222 92 222 C79 222 79 212 66 212
             A60 60 0 0 1 6 152 L6 104 A60 60 0 0 1 66 44 Z"/>
    <circle cx="74" cy="128" r="32" fill="#e5484d"/>
    <rect x="124" y="110" width="96" height="36" rx="18" fill="#c0caf5" fill-opacity="0.9"/>
  </g>
</svg>
