# macOS and Windows. Linux is checked by the flake (`nix flake check`).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; GitHub no longer accepts macos-14.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # transcribe.cpp builds its Vulkan backend from source: CMake needs
      # glslc and the headers, and the binaries link vulkan-1.lib (found
      # through VULKAN_SDK by earwig-transcribe's build script). The
      # runtime (vulkan-1.dll) lets the tests start on a runner without a
      # GPU driver; they fall back to the CPU.
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
