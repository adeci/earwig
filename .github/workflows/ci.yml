# Linux and macOS are the flake's checks, built by nixbot, whose release effect also makes a pushed
# v* tag's release. Nix can't build earwig for Windows (GPUI's shaders need the Windows SDK's
# fxc.exe, transcribe.cpp MSVC and the Vulkan SDK), so Windows and its release packages stay here,
# in jobs that keep the code which builds earwig away from what signs as its publisher:
#   build    rustup, the crates and their build scripts, the Vulkan SDK: clippy, the tests and the
#            release binaries, unsigned. No permissions: it fetches the public repository.
#   package  no cargo: signs the binaries, packages them and signs the installer. The only job
#            that may ask for an OIDC token and, on a v* tag, the only one in the release
#            environment.
#   test     the installer end to end on this runner's desktop, from the packages. No permissions.
#   release  v* tags: checks the signatures and attaches the packages to the release, the only
#            job that may write to the repository.
# packaging/windows/sign.ps1 decides how the packages are signed, packaging/windows/tools.psd1
# pins every tool the jobs download; of actions, only GitHub's own, pinned to commits. Artifacts
# only hand files on to the next jobs: kept two days, so a failed run can be re-run the next day.
# Every push runs this; a pull request only from a fork, as a branch here ran on its pushes. A push
# cancels its branch's older run. Only one build of a commit runs at a time: a v* tag's cancels the
# others, which otherwise wait their turn.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.sha }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # About 30 minutes from a cold cache; steps that can hang give up sooner.
    timeout-minutes: 45
    env:
      # The cargo cache's paths, restored and saved alike.
      CACHED: |
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        ~/.cargo/registry/src
        ~/.cargo/git/db
        target
    steps:
      # The commit under test from the public repository, as every job gets it: no token, no tags.
      - name: Check out
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git init -q
          git fetch -q --no-tags --depth=1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" $env:GITHUB_SHA
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
      # Release assets carry the workspace version: a v* tag that is not v and that version stops
      # here, before anything is built or signed.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            Write-Host "::error title=tag::$env:GITHUB_REF_NAME is not v$version, the version in Cargo.toml"
            exit 1
          }
      - name: Rust, the Vulkan SDK and CMake
        id: tools
        run: packaging/windows/tools.ps1 Rust VulkanSdk CMake
        timeout-minutes: 10
      # Only an exact match: one cache per toolchain, SDK, CMake, release build environment and
      # Cargo.lock, made from scratch, so it never grows. Any of them changing builds cold once.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHED }}
          key: cargo-windows-rust${{ steps.tools.outputs.rust }}-vulkan${{ steps.tools.outputs.vulkan }}-cmake${{ steps.tools.outputs.cmake }}-env${{ hashFiles('packaging/windows/release-env.ps1') }}-lock${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 20
      - run: cargo test --workspace --locked
        timeout-minutes: 20
      - name: The release binaries, unsigned
        run: packaging/windows/package.ps1 -Build
        timeout-minutes: 30
      # Its version and test feed are compiled in: it is built on branches only, and kept apart.
      - name: The update test's older build, unsigned
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: crates/earwig/tests/update/windows.ps1 -Build
        timeout-minutes: 15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: target/dist/
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: update-test-build
          path: target/update-test/build/
          if-no-files-found: error
          retention-days: 2
      - name: Save the cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHED }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  package:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    # On a tag, the release environment: Artifact Signing trusts this job's OIDC token there only.
    # Elsewhere the token names the branch, which it doesn't trust.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      id-token: write
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
    # The release environment's variables, none of them secret.
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Check out
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git init -q
          git fetch -q --no-tags --depth=1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" $env:GITHUB_SHA
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
      - name: Inno Setup and the Artifact Signing client
        run: packaging/windows/tools.ps1 InnoSetup ArtifactSigning
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: update-test-build
          path: target/update-test/build
      # Before anything is signed: a v* tag signs with Artifact Signing, or fails here naming what
      # it lacks.
      - name: How to sign
        id: signing
        run: |
          $mode = packaging/windows/sign.ps1 -Mode
          "mode=$mode" | Add-Content $env:GITHUB_OUTPUT
          $how = if ($mode -eq 'test') { 'the test publisher, a throwaway made on this runner' } else { 'Artifact Signing' }
          Write-Host "Signing with $how"
          "Signing with $how.`n" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Sign and package
        run: packaging/windows/package.ps1 -Package
        timeout-minutes: 20
      - name: The update test's installers
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: crates/earwig/tests/update/windows.ps1 -Package
        timeout-minutes: 15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: earwig-windows-x64
          path: |
            target/package/*.zip
            target/package/*-setup.exe
            target/package/winget
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: update-test-packages
          path: target/update-test/packages/
          if-no-files-found: error
          retention-days: 2
      # The test publisher's root certificate and profile EKUs; its key stays on this runner.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.signing.outputs.mode == 'test'
        with:
          name: test-publisher
          path: ${{ runner.temp }}/earwig-test-publisher.json
          if-no-files-found: error
          retention-days: 2

  test:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git init -q
          git fetch -q --no-tags --depth=1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" $env:GITHUB_SHA
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: earwig-windows-x64
          path: target/package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: update-test-packages
          path: target/update-test/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package.outputs.signing == 'test'
        with:
          name: test-publisher
          path: ${{ runner.temp }}/test-publisher
      - name: Trust the test publisher
        if: needs.package.outputs.signing == 'test'
        run: packaging/windows/sign.ps1 -Trust "$env:RUNNER_TEMP/test-publisher/earwig-test-publisher.json"
      # The model smoke.ps1 downloads, kept until models.toml changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/earwig/models
          key: earwig-models-${{ hashFiles('crates/earwig-core/models.toml') }}
      - name: Intel SDE
        run: packaging/windows/tools.ps1 Sde
        timeout-minutes: 5
      - name: Smoke test the installer
        run: packaging/windows/smoke.ps1
        timeout-minutes: 10
      # A tag's commit is tested on its branch, unless the tag cancelled that run.
      - name: Update end to end
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: crates/earwig/tests/update/windows.ps1 -Test
        timeout-minutes: 15

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, test]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git init -q
          git fetch -q --no-tags --depth=1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" $env:GITHUB_SHA
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: earwig-windows-x64
          path: target/package
      # sign.ps1 checks a v* tag's files as Artifact Signing signs them: nothing unsigned or signed
      # by anyone else goes out.
      - name: Check the release's signatures
        run: |
          Expand-Archive (Get-Item target/package/*.zip).FullName "$env:RUNNER_TEMP/release"
          $signers = packaging/windows/sign.ps1 -Check (Get-Item target/package/*-setup.exe).FullName `
            "$env:RUNNER_TEMP/release/earwig.exe" "$env:RUNNER_TEMP/release/earwigw.exe"
          foreach ($signer in $signers) { Write-Host "::notice title=signed::with Artifact Signing as $signer" }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash packaging/github-release.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" target/package/*.zip target/package/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached to $GITHUB_REF_NAME:" >>"$GITHUB_STEP_SUMMARY"
          for file in target/package/*.zip target/package/*-setup.exe; do
            sha256=$(sha256sum "$file" | cut -d' ' -f1)
            echo "::notice title=attached::$(basename "$file") to $GITHUB_REF_NAME, SHA-256 $sha256"
            echo "- $(basename "$file"), SHA-256 \`$sha256\`" >>"$GITHUB_STEP_SUMMARY"
          done
