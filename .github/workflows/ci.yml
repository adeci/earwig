# Linux and macOS are the flake's checks, built by nixbot, whose release effect also makes a pushed
# v* tag's release. Nix can't build earwig for Windows (GPUI's shaders need the Windows SDK's
# fxc.exe, transcribe.cpp MSVC and the Vulkan SDK), so Windows and its release packages stay here.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    # Tags attach the packages to their release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # transcribe.cpp's Vulkan backend builds with the SDK's glslc and headers and links
      # vulkan-1.lib; the runtime lets the tests start without a GPU driver, on the CPU.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The portable zip, the per-user installer and its winget manifests.
      - run: choco install innosetup --no-progress -y
      - run: packaging/windows/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with:
          name: earwig-windows-x64
          path: |
            target/package/*.zip
            target/package/*-setup.exe
            target/package/winget
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # nixbot's release effect usually made the release already; if not, this does.
          bash packaging/github-release.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" target/package/*.zip target/package/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
