# Throwaway probes for the macOS port: run on a real Mac through the relay,
# then deleted once the real implementation lands.
[package]
name = "earwig-macos-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
block2 = "0.6"
cpal = "0.18"
flume = "0.12"
gpui-kit = "=0.9.0"
hound = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
transcribe-cpp = { version = "0.4.1", default-features = false, features = [
  "metal",
] }
tray-icon = { version = "0.26", default-features = false }
